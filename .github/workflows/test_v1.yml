# Terraform Provider testing workflow.
name: Terraform Provider Tests (Testing Workflow)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  LATEST_TF_VERSION: 1.15.*

jobs:

  # ── Build & lint ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: false
      - run: go mod download && go mod tidy
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

  generate:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    name: Docu Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85
        with:
          terraform_version: ${{ env.LATEST_TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  gofix:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    name: Go Fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.2.0
        with:
          go-version-file: "go.mod"
          cache: false
      - run: go fix ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after running 'go fix'. Run 'go fix ./...' command and commit."; exit 1)

  fixtureDriftDetect:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    name: Fixture Drift Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/fixtureDriftDetect.sh btp/provider/fixtures/

  # ── Decide what to test ─────────────────────────────────────────────────────
  # Outputs three values consumed by the test jobs:
  #   run_provider    = true/false  — whether to run btp/provider/ tests
  #   run_internal    = true/false  — whether to run internal/ tests
  #   provider_filter = regex       — go test -run value; "." means full suite
  #
  # PR rules:
  #   btp/provider/ changed only → provider tests (path-filtered), skip internal
  #   internal/ changed          → provider tests (full) + internal tests
  #   both changed               → provider tests (full) + internal tests
  #   neither changed            → skip everything
  #
  # Non-PR (push to main, tag, release, manual): always run everything, full suite
  compute-test-filter:
    name: Compute Test Filter
    runs-on: ubuntu-latest
    outputs:
      run_provider:    ${{ steps.filter.outputs.run_provider }}
      run_internal:    ${{ steps.filter.outputs.run_internal }}
      provider_filter: ${{ steps.filter.outputs.provider_filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Non-PR trigger: always run everything
            echo "run_provider=true"    >> "$GITHUB_OUTPUT"
            echo "run_internal=true"    >> "$GITHUB_OUTPUT"
            echo "provider_filter=."    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count changed Go files per folder (implementation + test files both count)
          provider_changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'btp/provider/*.go' \
            | wc -l | tr -d ' ')
          internal_changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'internal/' \
            | grep '\.go$' | wc -l | tr -d ' ')

          echo "Provider files changed: $provider_changed"
          echo "Internal files changed: $internal_changed"

          if [ "$internal_changed" -gt 0 ]; then
            # internal/ changed: run full provider suite + full internal suite
            echo "run_provider=true"    >> "$GITHUB_OUTPUT"
            echo "run_internal=true"    >> "$GITHUB_OUTPUT"
            echo "provider_filter=."    >> "$GITHUB_OUTPUT"
          elif [ "$provider_changed" -gt 0 ]; then
            # only btp/provider/ changed: run path-filtered provider tests only
            filter=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'btp/provider/*.go' \
              | bash .github/scripts/get_test_filter.sh)
            echo "run_provider=true"    >> "$GITHUB_OUTPUT"
            echo "run_internal=false"   >> "$GITHUB_OUTPUT"
            echo "provider_filter=$filter" >> "$GITHUB_OUTPUT"
          else
            # nothing relevant changed (docs, CI files, etc.): skip all tests
            echo "run_provider=false"   >> "$GITHUB_OUTPUT"
            echo "run_internal=false"   >> "$GITHUB_OUTPUT"
            echo "provider_filter=."    >> "$GITHUB_OUTPUT"
          fi

  # ── Provider tests ──────────────────────────────────────────────────────────
  # Split into 4 shards by type × 3 Terraform versions = 12 parallel jobs.
  # resources | datasources | list-resources | actions+provider+functions
  test-provider:
    if: |
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      needs.compute-test-filter.outputs.run_provider == 'true'
    name: "Provider Tests - ${{ matrix.scope.name }} (TF ${{ matrix.terraform }})"
    needs: [build, compute-test-filter]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # List of Terraform versions to be tested - last three versions are in scope
        # Check https://endoflife.date/terraform for end of support dates
        # '1.6.*' end of security support 10 Apr 2024
        # '1.7.*' end of security support 26 Jun 2024
        # '1.8.*' end of security support 26 Nov 2024
        # '1.9.*' end of security support 27 Feb 2025
        # '1.10.*' end of security support 14 May 2025
        # '1.11.*' end of security support 20 Aug 2025
        # '1.12.*' end of security support 19 Nov 2025
        terraform:
          - "1.13.*"
          - "1.14.*"
          - "1.15.*"
        scope:
          - name: resources
            filter: "TestResource"
          - name: datasources
            filter: "TestDataSource"
          - name: list-resources
            filter: "ListResource"
          - name: actions-provider-functions
            filter: "TestAction|TestProvider|TestFunction|TestResolve|TestDrop|TestExtractLabelValue|TestToGetFormattedValue"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: false
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download && go mod tidy

      # Full suite (".") → use scope filter to keep shards balanced.
      # Path-filtered PR → use the specific test name(s) directly.
      # PR_FILTER is passed via env to prevent | characters from being
      # interpreted as shell pipe operators when inlined by ${{ }}.
      - name: Resolve effective test filter
        id: effective
        env:
          PR_FILTER: ${{ needs.compute-test-filter.outputs.provider_filter }}
        run: |
          if [ "$PR_FILTER" = "." ]; then
            echo "filter=${{ matrix.scope.filter }}" >> "$GITHUB_OUTPUT"
          else
            echo "filter=$PR_FILTER" >> "$GITHUB_OUTPUT"
          fi

      - run: go test -v -timeout=900s -parallel=16 -run '${{ steps.effective.outputs.filter }}' ./btp/provider/
        if: matrix.terraform != env.LATEST_TF_VERSION
        env:
          TF_ACC: "1"

      - uses: robherley/go-test-action@v1
        if: matrix.terraform == env.LATEST_TF_VERSION
        env:
          TF_ACC: "1"
        with:
          testArguments: -v -cover -coverprofile=cover-${{ matrix.scope.name }}.out -timeout=900s -parallel=16 -run '${{ steps.effective.outputs.filter }}' ./btp/provider/

      - uses: actions/upload-artifact@v7
        if: matrix.terraform == env.LATEST_TF_VERSION
        with:
          name: coverage-${{ matrix.scope.name }}
          path: cover-${{ matrix.scope.name }}.out

  # ── Internal tests ──────────────────────────────────────────────────────────
  # Pure unit tests — no VCR, no Terraform plugin server, very fast.
  # Always runs the full ./internal/... suite (no filtering needed).
  test-internal:
    if: |
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      needs.compute-test-filter.outputs.run_internal == 'true'
    name: Internal Package Tests
    needs: [build, compute-test-filter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: false
      - run: go mod download && go mod tidy
      - run: go test -v -timeout=120s -parallel=16 -cover -coverprofile=cover-internal.out ./internal/...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-internal
          path: cover-internal.out

  # ── Coverage merge ──────────────────────────────────────────────────────────
  # Collects whichever cover-*.out files were produced and merges them.
  # Runs as long as at least one test job succeeded (the other may be skipped).
  merge-coverage:
    if: |
      always() &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      (needs.test-provider.result == 'success' || needs.test-internal.result == 'success')
    name: Merge Coverage Reports
    needs: [test-provider, test-internal]
    runs-on: ubuntu-latest
    outputs:
      coverage_produced: ${{ steps.merge.outputs.coverage_produced }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Install gocovmerge
        run: go install github.com/wadey/gocovmerge@latest
      - name: Merge coverage files
        id: merge
        run: |
          files=$(ls cover-*.out 2>/dev/null | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No coverage files found — no tests ran, skipping merge"
            echo "coverage_produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Merging: $files"
          gocovmerge $files > cover.out
          echo "coverage_produced=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.merge.outputs.coverage_produced == 'true'
        with:
          name: coverage-report
          path: cover.out

  # ── SonarCloud ──────────────────────────────────────────────────────────────
  sonarcloud:
    if: |
      always() &&
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      needs.merge-coverage.result == 'success' &&
      needs.merge-coverage.outputs.coverage_produced == 'true'
    name: SonarCloud
    needs: [merge-coverage]
    runs-on: ubuntu-latest
    environment:
      name: btp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: coverage-report
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
